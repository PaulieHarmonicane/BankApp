<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrangeAdmin</title>
    <style>
        body, html {
            
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column; 
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        body {
            background-image: url("static/img/bgor.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        #header1 {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin: 0;
            padding: 0;
            color: rgb(255, 176, 66);
            font-size: 100px;
            -webkit-text-stroke: 3px rgb(50, 50, 50);
        }
        #layer1 {
            display: flex;         
            flex: 1 0 auto;          
            justify-content: center; 
            align-items: center;    
        }
        #layer2 {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 500px;
            align-items: center;
        }
        .btn {
            display: block;
            width: 400px;
            padding: 10px;
            text-align: center;
            background: rgb(157, 219, 163);
            border: 1px solid rgb(67, 115, 18);
            cursor: pointer;
            text-decoration: none;
            color: rgb(205, 130, 0);
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
        }
        .btn:hover {
            background: rgb(193, 232, 180);
            color: rgb(255, 169, 20);
            transform: scale(1.05);
        }

        .box {      
            position: absolute; 
            top: 0;
            right: 0;
            width: 300px;
            height: 200px;
        }
        .icon {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 50px;
            height: 50px;
        }
        .icon:hover {
            width: 70px;
            height: 70px;
        }

        #label {
            display: none;
            padding: 15px 20px;
            background-color: rgba(255, 255, 255, 0.7);
            border: 2px solid rgb(100, 100, 100); 
            border-radius: 10px;
            margin: 10px;
            font-size: 20px;
            color: rgb(140, 89, 1);
            align-self: center;
        }

        @media (max-width: 600px) {
            #header1 {
                width: 80%;
                font-size: 36px;
                -webkit-text-stroke: 2px rgb(50, 50, 50);
                margin-top: 20px;
                align-self: center;
            }

            #layer2 {
                width: 90%;
            }

            .btn {
                width: 100%;
                font-size: 18px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="header1">
    <h1>Админка</h1>
    </div>
    <div id="layer1">
        <div id="layer2">
            <a onclick="clear_data()" class="btn">Очистить таблицу</a>
        </div>
    </div>
    <div class="box">
        <a href="{{ url_for('start_page') }}" class="homebtn">
            <img src="{{ url_for('static', filename='img/home.png') }}" class="icon">

        </a>
    </div>
    <script>
        function clear_data() {
            fetch(`/clear_db`, {method: "POST"})
                .then(response => response.json())
                .then(data => {
                    if (data.status === -1) {
                        document.getElementById("label").style.display = "inline-block"
                        document.getElementById("label").innerText = "Ошибка";
                    } else {
                        window.location.href = "{{ url_for('start_page') }}";

                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Ошибка при запросе");
                });
        }
    </script>
</body>
</html>
